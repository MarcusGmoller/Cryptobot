<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Data Viewer</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Include Chart.js -->
    <style>
        /* Style for the overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Put the overlay on top */
            flex-direction: column;
        }

        /* Style for the content box in the overlay */
        #overlayContent {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            margin-bottom: 20px;
        }

        /* Table styles */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Style for the data display */
        #dataDisplay {
            font-family: Arial, sans-serif;
            color: #333;
            font-size: 16px;
            word-wrap: break-word;
        }

        /* Style for the chart container */
        #chartContainer {
            width: 100%;
            max-width: 600px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #fff;">WebSocket Data</h1>

    <!-- Overlay for displaying data -->
    <div id="overlay">
        <div id="overlayContent">
            <h2>Latest BTC-USD Data</h2>
            <!-- Table structure to display data -->
            <table>
                <tr>
                    <th>Price Level</th>
                    <th>Quantity</th>
                </tr>
                <tr>
                    <td id="priceLevel">N/A</td>
                    <td id="quantity">N/A</td>
                </tr>
            </table>
        </div>

        <!-- Container for the chart -->
        <div id="chartContainer">
            <canvas id="orderBookChart"></canvas>
        </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', (event) => {
        var socket = io();

        // Set up the chart
        var ctx = document.getElementById('orderBookChart').getContext('2d');
        var orderBookChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Price levels will go here
                datasets: [{
                    label: 'Quantity',
                    data: [], // Quantities will go here
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    fill: true
                }]
            },
            options: {
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Price Level'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Quantity (BTC)'
                        }
                    }
                }
            }
        });

        socket.on('data', function(data) {
          console.log('Data received from server:', data); 

          // Check and parse the incoming data if it's a string
          if (typeof data === 'string') {
              try {
                  data = JSON.parse(data);
              } catch (e) {
                  console.error('Error parsing data:', e);
                  return;
              }
          }

          // Extract the first bid from the 'updates' array (adjust as needed for your data structure)
          let updates = data.events && data.events[0] && data.events[0].updates;
          if (updates && updates.length > 0) {
              // Assuming we want the first update in the list
              let priceLevel = updates[0].price_level || "N/A";
              let quantity = updates[0].new_quantity || "N/A";

              // Update the static fields with new values
              document.getElementById("priceLevel").textContent = priceLevel;
              document.getElementById("quantity").textContent = quantity;

              // Update the chart with new data
              orderBookChart.data.labels.push(priceLevel);
              orderBookChart.data.datasets[0].data.push(quantity);
              
              // Limit data points to the last 10 entries for readability
              if (orderBookChart.data.labels.length > 10) {
                  orderBookChart.data.labels.shift();
                  orderBookChart.data.datasets[0].data.shift();
              }

              orderBookChart.update();
          } else {
              console.warn('No updates found in data:', data);
          }
        });
      });
    </script>
</body>
</html>
